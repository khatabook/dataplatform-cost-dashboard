services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cost
      POSTGRES_PASSWORD: cost
      POSTGRES_DB: cost_dashboard
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cost -d cost_dashboard"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - cost_pg:/var/lib/postgresql/data

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+psycopg2://cost:cost@db:5432/cost_dashboard
    depends_on:
      db:
        condition: service_healthy

  seed:
    build: .
    command: python -m scripts.seed
    environment:
      DATABASE_URL: postgresql+psycopg2://cost:cost@db:5432/cost_dashboard
    depends_on:
      migrate:
        condition: service_completed_successfully

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://cost:cost@db:5432/cost_dashboard
      SNOWFLAKE_CREDIT_USD: "3.0"
      STATIC_DIR: frontend/dist
    depends_on:
      seed:
        condition: service_completed_successfully

volumes:
  cost_pg:
