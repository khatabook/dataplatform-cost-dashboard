# Example Vault KV payload for:
#   path: private/data/prod-dataplatform/dataplatform-cost-dashboard
#   Kubernetes auth role: prod-dataplatform-dataplatform-cost-dashboard
#
# Create / update with vault CLI (do not commit real values):
#   vault kv put private/prod-dataplatform/dataplatform-cost-dashboard \
#     DATABASE_URL='postgresql+psycopg2://...' \
#     SNOWFLAKE_ACCOUNT='...' \
#     ...
#
# Or paste these keys into the Vault UI. The Agent Injector writes them to
# /vault/secrets/secrets.txt and scripts/entrypoint.sh exports them as env vars.

DATABASE_URL: postgresql+psycopg2://user:pass@host:5432/cost_dashboard

SNOWFLAKE_ACCOUNT: ""
SNOWFLAKE_USER: ""
SNOWFLAKE_PASSWORD: ""
SNOWFLAKE_WAREHOUSE: ""

REDASH_DATABASE_URL: postgresql+psycopg2://redash:pass@redash-db:5432/redash

TABLEAU_SERVER_URL: https://tableau.example.com
TABLEAU_SITE: ""
TABLEAU_PAT_NAME: ""
TABLEAU_PAT_SECRET: ""

AIRFLOW_API_URL: http://airflow-api-server.prod-dataplatform:8080
AIRFLOW_API_USER: ""
AIRFLOW_API_PASSWORD: ""

# Optional if the service account does not use IRSA for Athena / S3:
# AWS_ACCESS_KEY_ID: ""
# AWS_SECRET_ACCESS_KEY: ""
